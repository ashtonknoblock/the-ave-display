<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>The Ave</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="pages" class="pages">

    <!-- ===== Home ===== -->
    <main class="page layout active" data-page="home">
      <section class="time-panel">
        <div class="time-row">
          <div id="clock" class="clock">--:--</div>
          <div class="mini-wx" id="mini-wx"></div>
        </div>
        <div id="date" class="date">&nbsp;</div>
      </section>

      <section id="coming" class="coming-panel"></section>

      <section class="rotator" id="rotator">
        <div class="weather-panel slide active" data-slide="weather" data-seconds="25">
          <div class="now">
            <div id="now-icon" class="now-icon">·</div>
            <div>
              <div id="now-temp" class="now-temp">--°</div>
              <div id="now-desc" class="now-desc">Loading weather…</div>
              <div id="now-extra" class="now-extra"></div>
            </div>
          </div>
          <div id="forecast" class="forecast"></div>
        </div>
        <div class="weather-panel slide" data-slide="weekend" data-seconds="18" id="slide-weekend"></div>
        <div class="weather-panel slide portrait-only" data-slide="dates" data-seconds="12" id="slide-dates"></div>
        <div class="weather-panel slide" data-slide="local" data-seconds="15" id="slide-local"></div>
        <div class="dots" id="dots"></div>
      </section>
    </main>

    <!-- ===== Lights ===== -->
    <section class="page subpage" data-page="lights">
      <div class="page-head"><h1>Lights</h1></div>
      <div class="scenes" id="scenes"></div>
      <div class="hue-scenes" id="hue-scenes"></div>
      <section id="lights" class="lights-panel"></section>
    </section>

    <!-- ===== Timers ===== -->
    <section class="page subpage" data-page="timers">
      <div class="page-head"><h1>Timers</h1></div>
      <div class="timers-wrap">
        <div class="timer-start">
          <div class="presets" id="presets"></div>
          <div class="custom">
            <button class="adj" data-adj="-60">−1m</button>
            <div class="custom-time" id="custom-time">5:00</div>
            <button class="adj" data-adj="60">+1m</button>
            <button class="adj" data-adj="300">+5m</button>
            <button class="go" id="custom-go">Start</button>
          </div>
        </div>
        <div class="timer-list" id="timer-list"></div>
      </div>
    </section>

    <!-- ===== Calendar ===== -->
    <section class="page subpage" data-page="calendar">
      <div class="page-head"><h1>Calendar</h1></div>
      <div class="cal-cols">
        <div class="cal-col"><div class="slide-title">Our plans <small>next 60 days</small></div><div class="list" id="cal-mine"></div></div>
        <div class="cal-col"><div class="slide-title">Around Columbus <small>next 10 days</small></div><div class="list" id="cal-local"></div></div>
      </div>
    </section>
  </div>

  <!-- running timers, visible on every page -->
  <div class="timer-pills" id="timer-pills"></div>

  <!-- bottom dock -->
  <nav class="dock" id="dock">
    <button data-go="home"><span>🏠</span>Home</button>
    <button data-go="lights"><span>💡</span>Lights</button>
    <button data-go="timers"><span>⏲️</span>Timers</button>
    <button data-go="calendar"><span>📅</span>Calendar</button>
  </nav>

  <!-- timer done -->
  <div class="alarm" id="alarm" hidden>
    <div class="alarm-box">
      <div class="alarm-icon">⏰</div>
      <div class="alarm-title" id="alarm-title">Time's up</div>
      <div class="alarm-sub">Timer finished</div>
      <div class="alarm-btns">
        <button id="alarm-snooze">+1 min</button>
        <button id="alarm-stop" class="stop">Stop</button>
      </div>
    </div>
  </div>

  <footer id="status" class="status"></footer>

  <script src="app.js"></script>
</body>
</html>
